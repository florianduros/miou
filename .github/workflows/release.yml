name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  # Release unpublished packages.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: "github.repository_owner == 'florianduros' && contains(github.event.head_commit.message, 'chore: release')"
    permissions:
      contents: write
      # For crates trusted publishing
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # Generating a GitHub token, so that PRs and tags created by
      # the release-plz-action can trigger actions workflows.
      - name: Generate GitHub token
        uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          # GitHub App ID secret name
          app-id: ${{ secrets.APP_ID }}
          # GitHub App private key secret name
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

  # Build and publish release artifacts.
  artifact-release:
    needs: release-plz-release
    name: Artifact release - ${{ matrix.platform.os_name }}
    strategy:
      matrix:
        platform:
          - os_name: Linux-x86_64
            runs_on: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os_name: Linux-aarch64
            runs_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os_name: macOS-aarch64
            runs_on: macOS-latest
            target: aarch64-apple-darwin
          - os_name: Windows-x86_64
            runs_on: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build executable
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.platform.target }}
          args: "--locked --release --features vendored-openssl"
          strip: true
      - name: Publish artifacts
        uses: houseabsolute/actions-rust-release@v0
        with:
          executable-name: miou
          target: ${{ matrix.platform.target }}
